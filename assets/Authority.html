<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Authority Panel - AURA.OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f; --bg-secondary: #111118; --bg-tertiary: #1a1a24;
      --surface: rgba(20, 20, 30, 0.8); --surface-elevated: #181822;
      --border: rgba(255, 255, 255, 0.08); --border-focus: rgba(255, 255, 255, 0.14);
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-tertiary: #64748b;
      --accent-primary: #3b82f6; --accent-primary-light: rgba(59, 130, 246, 0.12);
      --accent-primary-dark: #2563eb; --accent-primary-glow: rgba(59, 130, 246, 0.35);
      --accent-success: #10b981; --accent-success-light: rgba(16, 185, 129, 0.12);
      --accent-warning: #f59e0b; --accent-warning-light: rgba(245, 158, 11, 0.12);
      --accent-danger: #ef4444; --accent-danger-light: rgba(239, 68, 68, 0.12);
      --accent-purple: #8b5cf6; --accent-purple-light: rgba(139, 92, 246, 0.12);
      --accent-pink: #ec4899; --accent-teal: #14b8a6;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4); --shadow-lg: 0 8px 24px rgba(0,0,0,0.5); --shadow-xl: 0 12px 36px rgba(0,0,0,0.6);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-width: 280px; --header-height: 64px;
      --neon-purple: #b46cff; --neon-cyan: #00f0ff;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { color: var(--text-primary); font-family: var(--font-sans); min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 600px 400px at 15% 20%, rgba(59,130,246,0.10) 0%, transparent 70%), radial-gradient(ellipse 500px 500px at 85% 70%, rgba(139,92,246,0.08) 0%, transparent 70%), linear-gradient(160deg, #0c0c16 0%, #0a0a0f 40%, #0e0e18 100%); z-index: -2; }
    ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: var(--bg-secondary); } ::-webkit-scrollbar-thumb { background: var(--accent-primary); }

    /* SIDEBAR & LAYOUT */
    .sidebar { width: var(--sidebar-width); background: rgba(12,12,20,0.95); backdrop-filter: blur(24px); border-right: 1px solid var(--border); position: fixed; left: 0; top: 0; bottom: 0; display: flex; flex-direction: column; z-index: 100; transition: transform 0.4s ease; }
    .sidebar::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent 0%, rgba(59,130,246,0.25) 25%, rgba(139,92,246,0.20) 55%, rgba(16,185,129,0.15) 80%, transparent 100%); }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-sub { font-size: 10px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 4px; }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .btn-logout:hover { border-color: var(--accent-danger); color: var(--accent-danger); }
    .nav-menu { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-group { margin-bottom: 20px; }
    .nav-group-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-tertiary); padding: 0 12px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 6px 0; border-radius: 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: #cbd5e1; background: rgba(20, 20, 30, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); text-decoration: none; }
    .nav-item:hover { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.15)); color: #fff; transform: translateY(-2px); border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25); }
    .nav-item.active { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); }
    .nav-item i { width: 18px; text-align: center; }
    
    .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
    .top-bar { background: rgba(10,10,16,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 90; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); font-family: var(--font-mono); }
    .breadcrumb span:last-child { color: var(--accent-primary); font-weight: 600; }
    .status-badge { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--accent-success-light); border: 1px solid rgba(16,185,129,0.2); border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--accent-success); }
    .content { padding: 32px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    /* AUTHORITY STYLES */
    .auth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .header-group { display: flex; align-items: center; gap: 16px; }
    .header-icon { width: 48px; height: 48px; background: var(--accent-primary-light); border: 1px solid var(--accent-primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--accent-primary); font-size: 20px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    .title { font-size: 24px; font-weight: 700; color: var(--text-primary); }
    .subtitle { font-size: 13px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 4px; }

    .btn { padding: 10px 20px; border: 1px solid transparent; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font-sans); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; outline: none; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-dark)); color: white; box-shadow: 0 4px 15px var(--accent-primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-primary-glow); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface); color: var(--text-primary); border-color: var(--accent-primary); }
    .btn-dashboard { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35); }
    .btn-dashboard:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5); }
    .btn-dashboard i { margin-right: 4px; }
    .btn-danger-ghost { background: transparent; color: var(--accent-danger); border-color: rgba(239,68,68,0.3); }
    .btn-danger-ghost:hover { background: var(--accent-danger-light); border-color: var(--accent-danger); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all 0.3s; }
    .stat-card:hover { border-color: rgba(59,130,246,0.3); transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 16px; }
    .stat-label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .input-group { position: relative; flex: 1; min-width: 200px; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
    .input-field { width: 100%; height: 45px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 16px 0 40px; color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-light); }

    .table-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { text-align: left; padding: 14px 20px; background: rgba(15, 15, 22, 0.8); color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: rgba(59, 130, 246, 0.05); }
    tbody tr:last-child td { border-bottom: none; }

    .user-cell { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: white; background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple)); flex-shrink: 0; }
    .user-name { font-weight: 600; color: var(--text-primary); }
    .role-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: var(--accent-primary-light); color: var(--accent-primary); border: 1px solid rgba(59, 130, 246, 0.2); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; width: 90%; max-width: 460px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .modal-close { background: none; border: none; color: var(--text-tertiary); font-size: 20px; cursor: pointer; transition: 0.2s; }
    .modal-close:hover { color: var(--accent-danger); }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .form-input { width: 100%; height: 45px; box-sizing: border-box; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; padding: 0 16px; color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; outline: none; transition: all 0.2s; }
    .form-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-light); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1001; transform: translateX(120%); transition: transform 0.4s ease; max-width: 380px; }
    .toast.show { transform: translateX(0); }
    .toast-content { font-size: 13px; font-weight: 500; }

    @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>
        <div class="logo">AURA.OS</div>
        <div class="logo-sub">v3.0.1 — CLOUDFLARE</div>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    <nav class="nav-menu">
      <div class="nav-group">
        <div class="nav-group-title">Core</div>
        <a href="/Dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="/Authority.html" class="nav-item active"><i class="fas fa-shield-alt"></i> Authority Panel</a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="breadcrumb"><span id="userEmail">system@aura.os</span><span>/</span><span>authority</span></div>
      </div>
      <div class="status-badge"><div style="width:8px; height:8px; background:#10b981; border-radius:50%;"></div><span>System Online</span></div>
    </header>

    <div class="content">
      <div class="auth-header">
        <div class="header-group">
          <div class="header-icon"><i class="fas fa-users-cog"></i></div>
          <div>
            <div class="title">User Management</div>
            <div class="subtitle">Authority / Access Control</div>
          </div>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <a href="/Dashboard.html" class="btn btn-dashboard"><i class="fas fa-home"></i> Dashboard</a>
          <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-user-plus"></i> Add User</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: var(--accent-primary-light); color: var(--accent-primary);"><i class="fas fa-users"></i></div>
          <div class="stat-label">Total Users</div>
          <div class="stat-value" id="statTotal" style="color: var(--accent-primary);">0</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="input-group">
          <div class="input-icon"><i class="fas fa-search"></i></div>
          <input type="text" id="searchInput" class="input-field" placeholder="Cari username..." onkeyup="renderTable()">
        </div>
      </div>

      <div class="table-box">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="3" style="text-align:center; padding:40px; color:var(--text-tertiary);">Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL: ADD USER -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Add New User</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="addUsername" class="form-input" placeholder="Masukkan username login">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="addPassword" class="form-input" placeholder="Masukkan password">
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="addRole" class="form-input">
          <option value="" disabled selected>Pilih Role --</option>
          <option value="ADMIN">Admin</option>
          <option value="OPERATOR">Operator</option>
          <option value="CS">Customer Service</option>
          <option value="MEMBER">Member</option>
        </select>
      </div>

      <button class="btn btn-primary" style="width: 100%; margin-top: 8px; justify-content: center; padding: 14px;" onclick="submitAddUser()">
        Save User
      </button>
    </div>
  </div>

  <div class="toast" id="toastEl"><div class="toast-content" id="toastMsg">Success</div></div>

    <script>
    // CEK LOGIN & ACCESS CONTROL
    const authToken = localStorage.getItem('aura_auth_token');
    const userRole = localStorage.getItem('aura_user_role');
    
    if (!authToken) { 
      window.location.href = '/Login.html'; 
    } else if (userRole !== 'ADMIN') {
      // Jika bukan admin, tendang ke dashboard!
      alert('Akses Ditolak! Halaman ini khusus untuk Admin.');
      window.location.href = '/Dashboard.html';
    } else {
      document.getElementById('userEmail').textContent = authToken + '@aura.os';
    }
    
    function logout() { localStorage.clear(); window.location.href = '/Login.html'; }

    let usersData = [];

    // LOAD USERS DARI BACKEND
    async function loadUsers() {
      try {
        const res = await fetch('/api/users', {
          headers: { 'x-auth-token': authToken }
        });
        if (res.status === 403) { alert('Sesi admin berakhir!'); window.location.href = '/Login.html'; return; }
        usersData = await res.json();
        document.getElementById('statTotal').textContent = usersData.length;
        renderTable();
      } catch (err) {
        showToast('Gagal memuat data user');
      }
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = usersData.filter(u => u.username.toLowerCase().includes(search));
      const tbody = document.getElementById('userTableBody');
      
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:40px; color:var(--text-tertiary);">No users found</td></tr>';
        return;
      }
      
      let html = '';
      filtered.forEach(u => {
        const initials = u.username.substring(0, 2).toUpperCase();
        html += `<tr>
          <td><div class="user-cell"><div class="avatar">${initials}</div><div class="user-name">${u.username}</div></div></td>
          <td><span class="role-badge">${u.role}</span></td>
          <td style="text-align:right;"><button class="btn btn-danger-ghost" onclick="confirmDelete('${u.username}')"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    function openModal() { document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }

    function showToast(msg) {
      const t = document.getElementById('toastEl');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // HAPUS USER KE BACKEND
    async function confirmDelete(username) {
       if(confirm('Hapus user @' + username + ' dari database?')) {
           try {
             const res = await fetch(`/api/users/${encodeURIComponent(username)}`, {
               method: 'DELETE',
               headers: { 'x-auth-token': authToken }
             });
             const data = await res.json();
             if (data.success) {
               showToast('User berhasil dihapus!');
               loadUsers(); // Reload data dari DB
             } else {
               showToast(data.error || 'Gagal menghapus');
             }
           } catch(err) {
             showToast('Kesalahan koneksi');
           }
       }
    }

    // TAMBAH USER KE BACKEND
    async function submitAddUser() {
      const data = {
        username: document.getElementById('addUsername').value,
        password: document.getElementById('addPassword').value,
        role: document.getElementById('addRole').value
      };
      
      if (!data.username || !data.password || !data.role) {
        showToast('Semua kolom wajib diisi!'); return;
      }
      
      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-auth-token': authToken },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (result.success) {
          closeModal();
          showToast('User berhasil ditambahkan ke database!');
          loadUsers(); // Reload data dari DB
          document.getElementById('addUsername').value = '';
          document.getElementById('addPassword').value = '';
          document.getElementById('addRole').value = '';
        } else {
          showToast(result.error || 'Gagal menambah user');
        }
      } catch(err) {
        showToast('Kesalahan koneksi');
      }
    }

    // Init
    loadUsers();
  </script>
</body>
</html>
