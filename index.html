<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AURA.OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-black: #050507; /* Hitam pekat */
      --bg-surface: #0f0f12; /* Hitam agak terang untuk input */
      --border-subtle: #1f1f24; 
      --border-medium: #2a2a30;
      --text-main: #ffffff; /* Teks putih bersih */
      --text-dim: #a1a1aa; 
      --text-faint: #71717a;
      --accent-main: #8b5cf6; /* Ungu vibrant */
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; display: flex; min-height: 100vh; background: var(--bg-black); }

    /* LEFT SIDE (LOGIN FORM - HITAM DENGAN HIGHLIGHT UNGU) */
    .login-side {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 40px; background: var(--bg-black); position: relative; overflow: hidden;
    }
    /* Efek Highlight Glow Ungu di Form */
    .login-side::before {
      content: ''; position: absolute; top: -150px; right: -150px; width: 500px; height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); z-index: 0;
    }
    .login-side::after {
      content: ''; position: absolute; bottom: -100px; left: -100px; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: 0;
    }
    .form-box { width: 100%; max-width: 380px; position: relative; z-index: 1; }
    .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .logo-text span { color: var(--accent-main); }
    .subtitle { color: var(--text-dim); font-size: 15px; margin-bottom: 32px; }
    
    .input-group { margin-bottom: 20px; position: relative; }
    .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
    .input-field {
      width: 100%; padding: 14px 16px 14px 45px; background: var(--bg-surface); border: 1px solid var(--border-medium);
      border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--text-main); transition: all 0.2s;
    }
    .input-field:focus { outline: none; border-color: var(--accent-main); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); background: #16161a; }
    .input-field::placeholder { color: var(--text-faint); }
    .input-icon { position: absolute; left: 16px; top: 38px; color: var(--text-faint); font-size: 16px; transition: color 0.2s; }
    .input-field:focus ~ .input-icon { color: var(--accent-main); }

    .btn-primary {
      width: 100%; padding: 14px; background: var(--accent-main); color: #fff; border: none; border-radius: 10px;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-primary:hover { background: #7c3aed; transform: translateY(-1px); }
    .btn-secondary {
      width: 100%; padding: 14px; background: transparent; color: var(--text-dim); border: 1px solid var(--border-medium); border-radius: 10px;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-surface); color: var(--text-main); border-color: var(--accent-main); }

    .footer-info { margin-top: 32px; text-align: center; font-size: 12px; color: var(--text-faint); }
    .ip-badge { display: inline-block; background: var(--bg-surface); padding: 4px 10px; border-radius: 20px; font-family: monospace; margin-bottom: 8px; border: 1px solid var(--border-subtle); color: var(--accent-main); }

    /* RIGHT SIDE (BRANDING - UNGU GELAP) */
    .brand-side {
      flex: 1; background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); 
      color: #fff; display: flex; flex-direction: column; justify-content: center;
      padding: 60px; position: relative; overflow: hidden;
    }
    .brand-side::before {
      content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      top: -200px; right: -200px; border-radius: 50%;
    }
    .brand-content { position: relative; z-index: 2; max-width: 500px; }
    .brand-logo { width: 50px; height: 50px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 32px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); backdrop-filter: blur(10px); }
    .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700; line-height: 1.2; margin-bottom: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
    .feature-list { display: flex; flex-direction: column; gap: 20px; }
    .feature-item { display: flex; align-items: center; gap: 16px; }
    .feature-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; }
    .feature-text h4 { font-size: 16px; font-weight: 600; color: #fff; }
    .feature-text p { font-size: 14px; color: rgba(255,255,255,0.8); }
    .brand-footer { position: absolute; bottom: 30px; left: 60px; color: rgba(255,255,255,0.7); font-size: 13px; }

    /* ALERT */
    .alert-box { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; align-items: center; gap: 10px; }
    .alert-error { background: rgba(239, 68, 68, 0.1); color: var(--accent-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }

    @media (max-width: 900px) { .brand-side { display: none; } }
  </style>
</head>
<body>
  <!-- LEFT: LOGIN FORM (HITAM + HIGHLIGHT UNGU) -->
  <div class="login-side">
    <div class="form-box">
      <div class="logo-text">AURA<span>.OS</span></div>
      <h2 class="subtitle">Masuk ke AURA.OS.</h2>

      <div class="alert-box" id="alertBox">
        <i class="fas fa-exclamation-circle" id="alertIcon"></i>
        <span id="alertMsg"></span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label class="input-label">Username / Gmail</label>
          <input type="text" id="username" class="input-field" placeholder="Masukkan username" required>
          <i class="fas fa-user input-icon"></i>
        </div>
        <div class="input-group">
          <label class="input-label">Password</label>
          <input type="password" id="password" class="input-field" placeholder="Masukkan password" required>
          <i class="fas fa-lock input-icon"></i>
        </div>

        <button type="submit" class="btn-primary" id="btnLogin">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>
        <button type="button" class="btn-secondary" onclick="showAlert('Fitur register belum dibuka!', 'error')">
          <i class="fas fa-user-plus"></i> Register Akun Baru
        </button>
      </form>

      <div class="footer-info">
        <div class="ip-badge">IP: 192.168.1.1</div>
        <p>Authorized personnel only. All activities are monitored.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT: BRANDING (UNGU) -->
  <div class="brand-side">
    <div class="brand-content">
      <div class="brand-logo"><i class="fas fa-shield-halved"></i></div>
      <h1 class="brand-title">HOME COMING </h1>
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon"><i class="fas fa-lock"></i></div>
          <div class="feature-text"><h4>Secure Session Access</h4><p>Enkripsi end-to-end.</p></div>
        </div>
        <div class="feature-item">
          <div class="feature-icon"><i class="fas fa-bolt"></i></div>
          <div class="feature-text"><h4>Fast Login</h4><p>Akses langsung ke panel.</p></div>
        </div>
        <div class="feature-item">
          <div class="feature-icon"><i class="fas fa-headset"></i></div>
          <div class="feature-text"><h4>24/7 Ready</h4><p>Sistem akan aktif.</p></div>
        </div>
      </div>
    </div>
    <div class="brand-footer">Authorized access.</div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      document.getElementById('btnLogin').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
      document.getElementById('btnLogin').disabled = true;

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('btnLogin').innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        document.getElementById('btnLogin').disabled = false;

        if (data.success) {
          showAlert(data.message, 'success');
          localStorage.setItem('aura_auth_token', data.user.username);
          localStorage.setItem('aura_user_role', data.user.role);
          setTimeout(() => window.location.href = '/Dashboard.html', 1000);
        } else {
          showAlert(data.error, 'error');
        }
      })
      .catch(() => {
        document.getElementById('btnLogin').innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        document.getElementById('btnLogin').disabled = false;
        showAlert('Kesalahan koneksi ke server.', 'error');
      });
    }

    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      const icon = document.getElementById('alertIcon');
      const msg = document.getElementById('alertMsg');
      box.style.display = 'flex';
      box.className = `alert-box alert-${type}`;
      icon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
      msg.textContent = message;
      if (type === 'error') setTimeout(() => box.style.display = 'none', 5000);
    }
  </script>
</body>
</html>
